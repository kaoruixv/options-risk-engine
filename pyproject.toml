[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "options-risk-engine"
version = "0.1.0"
description = "Derivatives pricing, vol surface, and delta-hedging simulation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/options_risk_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
src = ["src"]
line-length = 100

[project.urls]
Repository = "https://github.com/kaoruixv/options-risk-engine"
Issues = "https://github.com/kaoruixv/options-risk-engine/issues"
Changelog = "https://github.com/kaoruixv/options-risk-engine/blob/main/CHANGELOG.md"

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true
